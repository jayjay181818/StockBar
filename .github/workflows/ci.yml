name: Stockbar CI

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main, testing ]

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # macos-26 carries Xcode 26, the oldest toolchain the project is expected
    # to build with; xcode-27 matches the Xcode used for development. One
    # failing does not cancel the other, so each result is always reported.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    name: validate (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Show Xcode version
      run: xcodebuild -version

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        # Stockbar's own environment uses Python 3.13 (setup_python_env.sh).
        python-version: '3.13'
        cache: pip
        cache-dependency-path: Stockbar/Resources/requirements.txt

    - name: Install pinned Python dependencies
      run: python -m pip install -r Stockbar/Resources/requirements.txt

    - name: Install SwiftLint and ripgrep
      run: brew install swiftlint ripgrep

    - name: Python syntax and unit tests
      run: bash script/develop.sh python-tests

    - name: Tooling fixture tests
      run: python3 -B -m unittest discover -s Scripts/tests -p 'test_*.py'

    - name: Lint and invariant checks
      run: bash script/develop.sh checks

    - name: Build
      run: bash script/develop.sh build

    - name: Run Tests
      run: bash script/develop.sh test

    # The configuration that is released: optimised, with the hardened runtime.
    - name: Build (Release)
      run: bash script/develop.sh build-release

    - name: Retain test results on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: test-results-${{ matrix.runner }}
        path: build/results/*.xcresult
        if-no-files-found: ignore
        retention-days: 7

    - name: Retain validation logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: validation-logs-${{ matrix.runner }}
        path: build/logs/
        if-no-files-found: ignore
        retention-days: 14
