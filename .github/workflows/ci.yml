name: Stockbar CI

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main, testing ]

jobs:
  # Stockbar's own environment runs a current Python, which installs the
  # python_version >= "3.10" pins. The validate job covers the 3.9 fallback.
  python-current:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: Stockbar/Resources/requirements.txt

    - name: Install pinned Python dependencies
      run: python -m pip install -r Stockbar/Resources/requirements.txt

    - name: Python syntax and unit tests
      run: bash script/develop.sh python-tests

  validate:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7

    - name: Show Xcode version
      run: xcodebuild -version

    - uses: actions/setup-python@v7
      with:
        python-version: '3.9'
        cache: pip
        cache-dependency-path: Stockbar/Resources/requirements.txt

    - name: Install pinned Python dependencies
      run: python -m pip install -r Stockbar/Resources/requirements.txt

    - name: Install SwiftLint and ripgrep
      run: brew install swiftlint ripgrep

    - name: Python syntax and unit tests
      run: bash script/develop.sh python-tests

    - name: Tooling fixture tests
      run: python3 -B -m unittest discover -s Scripts/tests -p 'test_*.py'

    - name: Lint and invariant checks
      run: bash script/develop.sh checks

    - name: Build
      run: bash script/develop.sh build

    - name: Run Tests
      run: bash script/develop.sh test

    - name: Analyze
      run: bash script/develop.sh analyze

    - name: Retain validation logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: validation-logs
        path: build/logs/
        if-no-files-found: ignore
