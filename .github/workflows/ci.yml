name: Stockbar CI

on:
  push:
    branches: [ main, testing ]
  pull_request:
    branches: [ main, testing ]

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - name: Show Xcode version
      run: xcodebuild -version

    - uses: actions/setup-python@v7
      with:
        # Stockbar's own environment uses Python 3.13 (setup_python_env.sh).
        python-version: '3.13'
        cache: pip
        cache-dependency-path: Stockbar/Resources/requirements.txt

    - name: Install pinned Python dependencies
      run: python -m pip install -r Stockbar/Resources/requirements.txt

    - name: Install SwiftLint and ripgrep
      run: brew install swiftlint ripgrep

    - name: Python syntax and unit tests
      run: bash script/develop.sh python-tests

    - name: Tooling fixture tests
      run: python3 -B -m unittest discover -s Scripts/tests -p 'test_*.py'

    - name: Lint and invariant checks
      run: bash script/develop.sh checks

    - name: Build
      run: bash script/develop.sh build

    - name: Run Tests
      run: bash script/develop.sh test

    # The configuration that is released: optimised, with the hardened runtime.
    - name: Build (Release)
      run: bash script/develop.sh build-release

    - name: Retain test results on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: build/results/*.xcresult
        if-no-files-found: ignore
        retention-days: 7

    - name: Retain validation logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: validation-logs
        path: build/logs/
        if-no-files-found: ignore
        retention-days: 14
