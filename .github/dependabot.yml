version: 2
updates:
  # Actions used by .github/workflows/ci.yml.
  - package-ecosystem: github-actions
    directory: /
    target-branch: testing
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 3

  # Pinned packages for the bundled Python market-data helper.
  - package-ecosystem: pip
    directory: /Stockbar/Resources
    target-branch: testing
    schedule:
      interval: weekly
      day: monday
    groups:
      python-helper:
        patterns: ["*"]
    commit-message:
      prefix: "chore(python)"
    open-pull-requests-limit: 3
    # requirements.txt pins urllib3 and requests twice, split by python_version
    # markers: current releases for Stockbar's own environment (3.10+) and the
    # last releases Apple's /usr/bin/python3 3.9 (LibreSSL) can run. Dependabot
    # cannot tell those lines apart, so both packages are updated by hand: bump
    # only the >= "3.10" lines and keep the 3.9 lines as they are.
    ignore:
      - dependency-name: urllib3
      - dependency-name: requests
